name: Daily FPL post

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: Build the post without uploading or scheduling
        type: boolean
        default: false

concurrency:
  group: daily-fpl-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the daily scheduler
        env:
          SCHEDULER_TOKEN: ${{ secrets.SCHEDULER_SERVICE_TOKEN }}
        run: |
          url="https://www.sportsync.in/api/cron/daily-post"
          if [ "${{ inputs.dry }}" = "true" ]; then
            url="$url?dry=1"
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $SCHEDULER_TOKEN" \
            "$url"
