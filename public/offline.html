<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="theme-color" content="#050608">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<title>You're offline | FPL Insights</title>
		<style>
			:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #050608; color: #f5f5f4; }
			* { box-sizing: border-box; }
			body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 2rem 1.25rem; padding-top: calc(2rem + env(safe-area-inset-top)); padding-bottom: calc(2rem + env(safe-area-inset-bottom)); background: radial-gradient(circle at 50% 0%, rgba(200,255,61,.12), transparent 35%), #050608; }
			main { width: min(100%, 26rem); text-align: center; }
			.brand { color: #c8ff3d; font-size: .8rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
			h1 { margin: 1.5rem 0 .75rem; font-size: clamp(2rem, 8vw, 2.75rem); line-height: 1.05; }
			p { color: #a8a29e; line-height: 1.6; }
			button { min-height: 2.75rem; margin-top: 1rem; padding: .7rem 1.1rem; border: 0; border-radius: .5rem; background: #c8ff3d; color: #101207; font: inherit; font-weight: 700; cursor: pointer; }
		</style>
	</head>
	<body>
		<main>
			<div class="brand">FPL Insights</div>
			<h1>You're offline</h1>
			<p>Connect to the internet to refresh player stats, fixtures and insights.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
